server:
  port: ${BACKEND_PORT:8080}
spring:
  application:
    name: 'cliente-pedidos'
  datasource:
    url: jdbc:postgresql://${SQL_DATABASE_SERVER_HOST:localhost}:${SQL_DATABASE_SERVER_PORT:5432}/${SQL_DATABASE_NAME:modex}
    username: ${SQL_DATABASE_USERNAME:postgres}
    password: ${SQL_DATABASE_PASSWORD:postgres123}
    hikari:
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: update