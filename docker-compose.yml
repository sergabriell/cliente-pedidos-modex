version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-modex
    environment:
      POSTGRES_DB: modex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cliente-pedidos
    environment:
      BACKEND_PORT: 8080
      SQL_DATABASE_SERVER_HOST: postgres
      SQL_DATABASE_SERVER_PORT: 5432
      SQL_DATABASE_NAME: modex
      SQL_DATABASE_USERNAME: postgres
      SQL_DATABASE_PASSWORD: postgres123
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
